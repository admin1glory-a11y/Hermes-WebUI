version: '3.8'

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"   # API + Gateway
      - "9119:9119"   # Hermes Dashboard
    volumes:
      - hermes-data:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${API_SERVER_KEY:-change-this-to-a-strong-secret}

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://hermes:8642/v1
      - OPENAI_API_KEY=${API_SERVER_KEY:-change-this-to-a-strong-secret}
      - ENABLE_OLLAMA_API=false
    depends_on:
      - hermes

volumes:
  hermes-data:
  open-webui-data:
