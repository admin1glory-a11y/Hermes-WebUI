services:
  - type: docker
    name: hermes-agent
    image: nousresearch/hermes-agent:latest
    env:
      - key: API_SERVER_ENABLED
        value: "true"
      - key: HERMES_DASHBOARD
        value: "1"
      - key: API_SERVER_KEY
        sync: false   # Set this manually in Render dashboard (secret)
    volumes:
      - name: hermes-data
        mountPath: /opt/data
    ports:
      - "8642:8642"
      - "9119:9119"

  - type: docker
    name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    env:
      - key: OPENAI_API_BASE_URL
        value: "http://hermes-agent:8642/v1"
      - key: OPENAI_API_KEY
        fromDatabase:
          name: API_SERVER_KEY
      - key: ENABLE_OLLAMA_API
        value: "false"
    volumes:
      - name: open-webui-data
        mountPath: /app/backend/data
    ports:
      - "3000:8080"
    dependsOn:
      - hermes-agent
